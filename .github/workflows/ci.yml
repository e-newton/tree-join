name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows the Release workflow to reuse this entire gate (build/test,
  # integration, web) as a prerequisite before publishing.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # `npm run build` emits both the Node (extension.js) and web
      # (extension.web.js) bundles; fail fast if the web target went missing.
      - name: Assert web bundle was emitted
        run: test -f dist/extension.web.js
      # `npm test` includes the in-memory web-bundle audit (no Node-isms leaked).
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The integration suite launches a real VSCode (Electron) instance, which
      # needs a display server on headless CI. test:integration builds the
      # extension + test bundles before running vscode-test.
      - run: xvfb-run -a npm run test:integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # Restore Playwright's browser cache before `npm ci`, whose
      # @vscode/test-web → @playwright/browser-chromium postinstall downloads
      # chromium (~150MB) into this directory. Caching it avoids a re-download
      # (and the occasional download flake) on every run.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ms-playwright-${{ runner.os }}-
      - run: npm ci
      # The downloaded chromium ships without its system libraries.
      - run: npx playwright install-deps chromium
      # The web smoke launches headless chromium against a real vscode.dev-style
      # web host (pinned to stable via the test:web script) and round-trips
      # toggle across both grammar WASMs. This is the only CI check that proves
      # the web bundle actually runs in a browser.
      - run: npm run test:web
