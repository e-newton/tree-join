name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # `npm run build` emits both the Node (extension.js) and web
      # (extension.web.js) bundles; fail fast if the web target went missing.
      - name: Assert web bundle was emitted
        run: test -f dist/extension.web.js
      # `npm test` includes the in-memory web-bundle audit (no Node-isms leaked).
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The integration suite launches a real VSCode (Electron) instance, which
      # needs a display server on headless CI. test:integration builds the
      # extension + test bundles before running vscode-test.
      - run: xvfb-run -a npm run test:integration
